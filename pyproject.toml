[project]
name = "estimador-cag"
version = "0.1.0"
description = "Estimador de software con arquitectura CAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.159.1",
    "jinja2>=3.1.6",
    "langfuse>=5.0.2,<6",
    "openai>=3.36.1",
    "presidio-analyzer>=2.2.359",
    "presidio-anonymizer>=2.2.359",
    "pydantic-settings>=2.16.1",
    "pypdf>=7.0.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "redisvl>=0.30.0",
    "structlog>=26.1.0",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not presidio and not redis'"
markers = [
    "presidio: requiere Presidio con el modelo spaCy es_core_news_md",
    "redis: requiere Redis con búsqueda vectorial",
]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
