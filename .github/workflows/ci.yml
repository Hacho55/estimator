name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: "Evals contra el modelo real: hard (propiedades) o full (más consistencia y juez)"
        type: choice
        options: [hard, full]
        default: hard

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          prune-cache: false
      - name: Instalar dependencias
        run: uv sync --locked
      - name: Estructura
        run: uv run python scripts/check_structure.py
      - name: Ruff
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest
        env:
          LITELLM_API_KEY: dummy
          LITELLM_BASE_URL: https://example.invalid
          LLM_MODEL: openrouter/openai/gpt-4o-mini
          APP_ENV: development
          LANGFUSE_PUBLIC_KEY: ""
          LANGFUSE_SECRET_KEY: ""
      - name: El servidor arranca
        env:
          LITELLM_API_KEY: dummy
          LITELLM_BASE_URL: https://example.invalid
          LLM_MODEL: openrouter/openai/gpt-4o-mini
          APP_ENV: development
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/docs >/dev/null
          curl --fail --silent http://127.0.0.1:8000/api/v1/context >/dev/null
      - name: Presupuesto de las variantes
        run: uv run python scripts/run_experiment.py --dry-run
        env:
          LITELLM_API_KEY: dummy
          LITELLM_BASE_URL: https://example.invalid
          LLM_MODEL: openrouter/openai/gpt-4o-mini
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Front
        working-directory: web
        run: |
          npm ci
          npm run build
          node --experimental-strip-types --test lib/readEstimateStream.test.ts

  presidio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          prune-cache: false
      - name: Instalar dependencias y modelo spaCy
        run: |
          uv sync --locked
          uv run python -m spacy download es_core_news_md
      - name: Tests Presidio
        run: uv run pytest -m presidio
        env:
          LITELLM_API_KEY: dummy
          LITELLM_BASE_URL: https://example.invalid
          LLM_MODEL: openrouter/openai/gpt-4o-mini
          APP_ENV: development
          LANGFUSE_PUBLIC_KEY: ""
          LANGFUSE_SECRET_KEY: ""

  # Evals contra el modelo real (fase 4, D12). Cuestan dinero: hard en PR a main y a mano;
  # soft y juez solo a mano. Sin el secreto, el job no hace nada.
  evals-hard:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    env:
      LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
      LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      CRITIC_MODEL: ${{ vars.CRITIC_MODEL }}
      APP_ENV: ci
      LANGFUSE_PUBLIC_KEY: ""
      LANGFUSE_SECRET_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          prune-cache: false
      - name: Instalar dependencias
        run: uv sync --locked
      - name: Evals hard
        if: env.LITELLM_API_KEY != ''
        run: uv run pytest evals -m "eval and not slow"
      - name: Sin credenciales
        if: env.LITELLM_API_KEY == ''
        run: echo "Sin LITELLM_API_KEY en los secretos del repositorio; evals omitidas."

  evals-full:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'full'
    runs-on: ubuntu-latest
    env:
      LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
      LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      CRITIC_MODEL: ${{ vars.CRITIC_MODEL }}
      EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL }}
      APP_ENV: ci
      LANGFUSE_PUBLIC_KEY: ""
      LANGFUSE_SECRET_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          prune-cache: false
      - name: Instalar dependencias
        run: uv sync --locked
      - name: Evals soft y juez
        if: env.LITELLM_API_KEY != ''
        run: uv run pytest evals -m "eval and slow"

  redis:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis/redis-stack-server:latest
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          prune-cache: false
      - name: Instalar dependencias
        run: uv sync --locked
      - name: Tests Redis
        run: uv run pytest -m redis
        env:
          LITELLM_API_KEY: dummy
          LITELLM_BASE_URL: https://example.invalid
          LLM_MODEL: openrouter/openai/gpt-4o-mini
          APP_ENV: development
          REDIS_URL: redis://127.0.0.1:6379
          SEMANTIC_CACHE_MODE: on
          LANGFUSE_PUBLIC_KEY: ""
          LANGFUSE_SECRET_KEY: ""
