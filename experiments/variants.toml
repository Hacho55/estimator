# Cada variante cambia una sola cosa respecto a la configuración por defecto.
# Compararlas: uv run python scripts/run_experiment.py
# Sin llamar al modelo: uv run python scripts/run_experiment.py --dry-run

[[variant]]
name = "baseline"

[[variant]]
name = "format-plain"
format = "plain"

[[variant]]
name = "format-json"
format = "json"

[[variant]]
name = "detail-summary"
detail_level = "summary"

[[variant]]
name = "detail-full"
detail_level = "full"

[[variant]]
name = "examples-3"
max_examples = 3

[[variant]]
name = "cache-off"
prompt_cache = "off"

[[variant]]
name = "model-haiku"
model = "openrouter/anthropic/claude-haiku-4.5"

[[variant]]
name = "prompt-v2"
prompt_version = "v2"

# Sesión 5 · tiers y revisión (3E, 5F). Plantilla v4 por perfil; review fuerza la revisión
# Actor-Critic-Boss a "acb" o "none" para medir si compensa en cada tier.
# Solo estas: uv run python scripts/run_experiment.py --variant tier- --name tiers

[[variant]]
name = "tier-developer"
tier = "developer"

[[variant]]
name = "tier-developer-acb"
tier = "developer"
review = "acb"

[[variant]]
name = "tier-pm-none"
tier = "pm"
review = "none"

[[variant]]
name = "tier-pm-acb"
tier = "pm"
review = "acb"

[[variant]]
name = "tier-executive-none"
tier = "executive"
review = "none"

[[variant]]
name = "tier-executive-acb"
tier = "executive"
review = "acb"
